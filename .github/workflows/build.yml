name: Build Islet installer

# Every push to main tests the code, builds the Windows installer and publishes it as a GitHub Release,
# so the latest installer is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/Islet-Setup.exe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the build create the Release and attach the installer

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Islet-Setup
          path: dist/Islet-Setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Islet ${{ steps.v.outputs.version }}
          files: dist/Islet-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
